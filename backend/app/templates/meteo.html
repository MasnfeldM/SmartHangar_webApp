<!DOCTYPE html>
<html lang="cz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meteo_data</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='Spaniel_ikona.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Meteorologická Data</h1>
    <div class="navigation">
        <h2>Rozcestník</h2>
        <button class="nav-link" onclick="window.location.href='{{ url_for('index') }}'">Domů</button>
        <button class="nav-link" onclick="window.location.href='{{ url_for('meteo_page') }}'">Meteo data</button>
        <button class="nav-link" onclick="window.location.href='{{ url_for('prediction_page') }}'">Data predikce</button>
    </div>
    <div class="view-toggle">
        <button class="view-btn active" id="btnTable" onclick="setView('table')" {% if view == 'table' %}disabled{% endif %}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="14" height="3" rx="1" fill="currentColor"/>
            <rect x="1" y="6" width="14" height="3" rx="1" fill="currentColor"/>
            <rect x="1" y="11" width="14" height="3" rx="1" fill="currentColor"/>
            </svg>
            Tabulka
        </button>
        <button class="view-btn" id="btnChart" onclick="setView('chart')" {% if view == 'chart' %}disabled{% endif %}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="1,13 5,7 9,10 15,3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            Graf
        </button>
    </div>
    <div class="export-btn">
        <button onclick="downloadFiles()" class="btn">Export CSV</button>
        <span class="export-info">Exportuje všechna data do dvou CSV souborů (meteo a historie predikcí).</span>
    </div>
    <div id="viewTable">
        <div class="pagination-bar">
            <div class="rows-select-wrap">
                <label for="rowsPerPage">Řádků na stránku:</label>
                <select class="rowsPerPage" id="rowsPerPage" name="limit" onchange="goToOffset(0, this)">
                    <option value="5"   {% if limit == 5   %} selected {% endif %}>5</option>
                    <option value="10"  {% if limit == 10  %} selected {% endif %}>10</option>
                    <option value="25"  {% if limit == 25  %} selected {% endif %}>25</option>
                    <option value="50"  {% if limit == 50  %} selected {% endif %}>50</option>
                    <option value="100" {% if limit == 100 %} selected {% endif %}>100</option>
                    <option value=""   {% if limit == totalCount %} selected {% endif %}>Vše</option>
                </select>
            </div>

            <div class="page-counter">
                <label>Stránka:</label>
                <button data-nav="first" onclick="goToOffset(0)">&#8676;</button>
                <button data-nav="prev"  onclick="goToOffset(currentOffset - currentLimit)">&#8592;</button>
                <span class="page-display" id="pageDisplay"></span>
                <button data-nav="next"  onclick="goToOffset(currentOffset + currentLimit)">&#8594;</button>
                <button data-nav="last"  onclick="goToOffset((totalPages - 1) * currentLimit)">&#8677;</button>
            </div>
        
            <span class="page-info" id="pageInfo"></span>
        </div>

        <table border="1">
            <thead>
                <tr>
                    <th>Datum</th>
                    <th>Teplota [°C]</th>
                    <th>Rosný bod [°C]</th>
                    <th>Směr větru [°]</th>
                    <th>Atmosferický tlak [hPa]</th>
                    <th>Rychlost větru [m/s]</th>
                    <th>Vlhkost [%]</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        
        <div class="pagination-bar">
            <div class="rows-select-wrap">
                <label for="rowsPerPage">Řádků na stránku:</label>
                <select class="rowsPerPage" id="rowsPerPage" name="limit" onchange="goToOffset(0, this)">
                    <option value="5"   {% if limit == 5   %} selected {% endif %}>5</option>
                    <option value="10"  {% if limit == 10  %} selected {% endif %}>10</option>
                    <option value="25"  {% if limit == 25  %} selected {% endif %}>25</option>
                    <option value="50"  {% if limit == 50  %} selected {% endif %}>50</option>
                    <option value="100" {% if limit == 100 %} selected {% endif %}>100</option>
                    <option value=""   {% if limit == totalCount %} selected {% endif %}>Vše</option>
                </select>
            </div>

            <div class="page-counter">
                <label>Stránka:</label>
                <button data-nav="first" onclick="goToOffset(0)">&#8676;</button>
                <button data-nav="prev"  onclick="goToOffset(currentOffset - currentLimit)">&#8592;</button>
                <span class="page-display" id="pageDisplay"></span>
                <button data-nav="next"  onclick="goToOffset(currentOffset + currentLimit)">&#8594;</button>
                <button data-nav="last"  onclick="goToOffset((totalPages - 1) * currentLimit)">&#8677;</button>
            </div>

            <span class="page-info" id="pageInfo"></span>
        </div>
    </div>
    <div id="viewChart" style="display: none;">
        <div class="window-controls">
            <label for="windowSizeInput">Velikost okna:</label>
            <button onclick="windowSize(false)">
                <i class="fa fa-search-plus" aria-hidden="true"></i>
            </button>
            <select class="windowSizeInput" id="windowSizeInput" name="limit" onchange="goToOffset(0, this)">
                    <option value="5"   {% if limit == 5   %} selected {% endif %}>5</option>
                    <option value="10"  {% if limit == 10  %} selected {% endif %}>10</option>
                    <option value="25"  {% if limit == 25  %} selected {% endif %}>25</option>
                    <option value="50"  {% if limit == 50  %} selected {% endif %}>50</option>
                    <option value="100" {% if limit == 100 %} selected {% endif %}>100</option>
                    <option value=""   {% if limit == totalCount %} selected {% endif %}>Vše</option>
                </select>
            <button onclick="windowSize(true)">
                <i class="fa fa-search-minus" aria-hidden="true"></i>
            </button>

            <div class="page-counter">
                <label>Stránka:</label>
                <button data-nav="first" onclick="goToOffset(0)">&#8676;</button>
                <button data-nav="prev"  onclick="goToOffset(currentOffset - currentLimit)">&#8592;</button>
                <span class="page-display" id="pageDisplay"></span>
                <button data-nav="next"  onclick="goToOffset(currentOffset + currentLimit)">&#8594;</button>
                <button data-nav="last"  onclick="goToOffset((totalPages - 1) * currentLimit)">&#8677;</button>
            </div>

            <span class="page-info" id="pageInfo"></span>
        </div>
               
        <div class="chart-wrapper">
            <canvas id="meteoChart"></canvas>
            
        </div>
        <div class="metric-row" id="meteoCards"></div>
        <div class="window-controls">
            <label for="windowSizeInput">Velikost okna:</label>
            <button onclick="windowSize(false)">
                <i class="fa fa-search-plus" aria-hidden="true"></i>
            </button>
            <select class="windowSizeInput" id="windowSizeInput" name="limit" onchange="goToOffset(0, this)">
                    <option value="5"   {% if limit == 5   %} selected {% endif %}>5</option>
                    <option value="10"  {% if limit == 10  %} selected {% endif %}>10</option>
                    <option value="25"  {% if limit == 25  %} selected {% endif %}>25</option>
                    <option value="50"  {% if limit == 50  %} selected {% endif %}>50</option>
                    <option value="100" {% if limit == 100 %} selected {% endif %}>100</option>
                    <option value=""   {% if limit == totalCount %} selected {% endif %}>Vše</option>
                </select>
            <button onclick="windowSize(true)">
                <i class="fa fa-search-minus" aria-hidden="true"></i>
            </button>

            <div class="page-counter">
                <label>Stránka:</label>
                <button data-nav="first" onclick="goToOffset(0)">&#8676;</button>
                <button data-nav="prev"  onclick="goToOffset(currentOffset - currentLimit)">&#8592;</button>
                <span class="page-display" id="pageDisplay"></span>
                <button data-nav="next"  onclick="goToOffset(currentOffset + currentLimit)">&#8594;</button>
                <button data-nav="last"  onclick="goToOffset((totalPages - 1) * currentLimit)">&#8677;</button>
            </div>

            <span class="page-info" id="pageInfo"></span>
        </div>
    </div>
    

</body>
<script>
async function fetchAndRender(offset, limit) {
    sessionStorage.setItem('meteoOffset', offset);
    sessionStorage.setItem('meteoLimit', limit);

    const res  = await fetch(`/api/meteo?offset=${offset}&limit=${limit}`);
    const json = await res.json();
    

    currentOffset = json.offset;
    currentLimit  = json.limit;
    totalPages    = json.total_pages;
    totalCount    = json.total_count;

    Object.assign(meteoData, {
        temp:  json.data.map(r => r.temp_out),
        dew:   json.data.map(r => r.dew_out),
        hum:   json.data.map(r => r.hum_out),
        wind:  json.data.map(r => r.windspeed),
        pres:  json.data.map(r => r.qnh),
    });
    meteoLabels.length = 0;
    meteoLabels.push(...json.data.map(r => r.Datetime));

    const newMaxOffset = Math.max(0, (totalPages - 1) * currentLimit);
    currentOffset = Math.min(currentOffset, newMaxOffset);

    console.log(buildMeteoScales());
    console.log(buildMeteoDatasets());

    updatePagination(json.offset, json.limit, json.total_count);
    renderTable(json.data);
    renderMeteoCards();
    buildMeteoChart();
}



function setView(view) {
    document.getElementById('btnTable').classList.toggle('active', view === 'table');
    document.getElementById('btnChart').classList.toggle('active', view === 'chart');

    document.getElementById('viewTable').style.display = view === 'table' ? '' : 'none';
    document.getElementById('viewChart').style.display = view === 'chart' ? '' : 'none';

    localStorage.setItem('meteoView', view);
}


async function goToOffset(offset, trigger) {
    const limitVal = trigger?.tagName === 'SELECT'
        ? Number(trigger.value)
        : currentLimit;

    await fetchAndRender(offset, limitVal);
}

async function windowSize(zoom) {
    const steps = [5, 10, 25, 50, 100, totalCount];
    const idx = steps.findIndex(s => s >= currentLimit);
    const safeIdx = idx === -1 ? steps.length - 1 : idx;

    const newIdx = zoom
        ? (safeIdx < steps.length - 1 ? safeIdx + 1 : safeIdx)
        : (safeIdx > 0 ? safeIdx - 1 : safeIdx);

    await fetchAndRender(currentOffset, steps[newIdx]);
}

function updatePagination(offset, limit, total) {
    const maxTotal = typeof total === "object"
        ? Object.values(total).reduce((a, b) => a + (Number(b) || 0), 0)
        : (Number(total) || 0);

    const pages = Math.ceil(maxTotal / limit) || 1;

    const from = maxTotal === 0 ? 0 : offset + 1;
    const to = Math.min(offset + limit, maxTotal);
    const atStart = offset <= 0;
    const atEnd = offset + limit >= maxTotal;

    document.querySelectorAll('.rowsPerPage, .windowSizeInput').forEach(select => {
        const allOption = select.querySelector('option:last-child');
        if (allOption) {
            allOption.value = maxTotal;
            allOption.textContent = "Vše";
        }
    });

    document.querySelectorAll('.page-display')
        .forEach(el =>
            el.textContent = `${Math.floor(offset / limit) + 1} / ${pages}`
        );

    document.querySelectorAll('.page-info')
        .forEach(el =>
            el.textContent = `${from}–${to} z ${maxTotal} záznamů`
        );

    document.querySelectorAll('[data-nav="first"], [data-nav="prev"]')
        .forEach(btn => btn.disabled = atStart);

    document.querySelectorAll('[data-nav="next"], [data-nav="last"]')
        .forEach(btn => btn.disabled = atEnd);

    document.querySelectorAll('.rowsPerPage')
        .forEach(el => el.value = limit);

    document.querySelectorAll('.windowSizeInput')
        .forEach(el => el.value = limit);
}




// Pomocné funkce
function avg(arr) { return arr.reduce((a,b) => a+b, 0) / arr.length; }
function fmt(v, d=1) { return (+v).toFixed(d); }

// Metrické karty
function renderMeteoCards() {
    const el = document.getElementById('meteoCards');
    el.innerHTML = Object.entries(meteoMeta)
        .filter(([k]) => meteoActive[k])
        .map(([k, m]) => {
            const vals = meteoData[k].map(Number);
            const mn = fmt(Math.min(...vals));
            const mx = fmt(Math.max(...vals));
            const av = fmt(avg(vals));
            return `<div class="metric-card">
                <div class="label">${m.label}</div>
                <div class="value" style="color:${m.color}">avg. ${av}<span class="unit"> ${m.unit}</span></div>
                <div class="range">min. ${mn}<span class="unit"> ${m.unit}</span></div> 
                <div class="range">max. ${mx}<span class="unit"> ${m.unit}</span></div>
            </div>`;
        }).join('');
}



// Sestavení datasetů
function buildMeteoDatasets() {
    return Object.entries(meteoMeta)
        .map(([k, m]) => ({
            key: k,
            label: m.label,
            data: meteoData[k].map(Number),
            borderColor: m.color,
            backgroundColor: m.color + '22',
            borderWidth: 2,
            pointRadius: 3,
            pointHoverRadius: 6,
            tension: 0.3,
            fill: false,
            yAxisID: m.axis,
            hidden: !meteoActive[k],
        }));
}

// Sestavení os Y
function buildMeteoScales() {
    const gridColor = 'rgba(0,0,0,0.07)';
    const tickColor = 'rgba(0,0,0,0.45)';
    const scales = {
        x: {
            ticks: { 
                color: tickColor, 
                maxTicksLimit: 10, 
                font: { size: 11 },
                minRotation: 10,
                maxRotation: 90,
            grid:  { color: gridColor },
            }
        },
    };
    meteoActive && Object.entries(meteoMeta).forEach(([k, m]) => {
        scales[m.axis] = {
            type: 'linear',
            position: m.axis === 'yLeft' ? 'left' : 'right',
            ticks: { color: tickColor, font: { size: 11 }, callback: v => `${v} ${m.unit}` },
            grid:  { display: m.axis === 'yLeft', color: gridColor },
            display: meteoActive[k],
        };
    });
    return scales;
}

let meteoChartInst = null;

function buildMeteoChart() {
    if (meteoChartInst) meteoChartInst.destroy();
    meteoChartInst = new Chart(document.getElementById('meteoChart'), {
        type: 'line',
        data: { labels: meteoLabels, datasets: buildMeteoDatasets() },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            resizeDelay: 200,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { display: true,
                        position: 'top', 
                        align: 'start', 
                        labels: {usePointStyle: true}, 
                        title: {display: true, text: 'Legenda', font: {size: 14}, position: 'start'} ,
                        onClick(e, legendItem, legend) {
                            const ds = legend.chart.data.datasets[legendItem.datasetIndex];

                            meteoActive[ds.key] = !meteoActive[ds.key];

                            sessionStorage.setItem("meteoActive", JSON.stringify(meteoActive));

                            requestAnimationFrame(() => {
                                meteoChartInst.destroy();
                                buildMeteoChart();
                                renderMeteoCards();
                            });
                }}   
                    ,
                tooltip: {
                    enabled: true,
                    callbacks:{
                            label: function(context) {
                                const dataset = context.dataset;
                                const value = context.raw;
                                const unit = meteoMeta[Object.keys(meteoMeta)[context.datasetIndex]].unit;
                                return `${dataset.label}: ${value} ${unit}`;
                            }  
                    }
                },
                
            },
            scales: buildMeteoScales(),
    }});

}



function renderTable(data) {
    const tbody = document.querySelector('#viewTable table tbody');
    tbody.innerHTML = data.map(r => `
        <tr>
            <td>${r.Datetime ?? '-'}</td>
            <td>${r.temp_out ?? '-'}</td>
            <td>${r.dew_out ?? '-'}</td>
            <td>${r.winddir ?? '-'}</td>
            <td>${r.qnh ?? '-'}</td>
            <td>${r.windspeed ?? '-'}</td>
            <td>${r.hum_out ?? '-'}</td>
        </tr>
    `).join('');
}

// Inicializace
const meteoLabels = {{ data | map(attribute='Datetime') | list | tojson | safe }};
const meteoData = {
    temp:  {{ data | map(attribute='temp_out')  | list | tojson | safe }},
    dew:   {{ data | map(attribute='dew_out')   | list | tojson | safe }},
    hum:   {{ data | map(attribute='hum_out')   | list | tojson | safe }},
    wind:  {{ data | map(attribute='windspeed') | list | tojson | safe }},
    pres:  {{ data | map(attribute='qnh')       | list | tojson | safe }},
};


const meteoMeta = {
    temp: { label: 'Teplota',        unit: '°C',   color: '#D85A30', axis: 'yLeft'  },
    dew:  { label: 'Rosný bod',      unit: '°C',   color: '#1D9E75', axis: 'yLeft'  },
    hum:  { label: 'Vlhkost',        unit: '%',    color: '#378ADD', axis: 'yHum'   },
    wind: { label: 'Rychlost větru', unit: 'm/s',  color: '#BA7517', axis: 'yWind'  },
    pres: { label: 'Tlak',           unit: 'hPa',  color: '#7F77DD', axis: 'yPres'  },
};

// Stav: které metriky jsou aktivní
let meteoActive = sessionStorage.getItem('meteoActive') && JSON.parse(sessionStorage.getItem('meteoActive')) || { temp: true, hum: true, dew: true, wind: false, pres: false };

let currentOffset;
let currentLimit;
let totalPages;
let totalCount;


const savedView    = localStorage.getItem('meteoView') || 'table';
const savedOffset  = Number(sessionStorage.getItem('meteoOffset')) || 0;
const savedLimit   = Number(sessionStorage.getItem('meteoLimit'))  || 100;

setView(savedView);

fetchAndRender(savedOffset, savedLimit);

function downloadFiles() {
    const res = fetch('/export_csv').then(r => r.json()).then(data => {
        const meteoBlob = new Blob([data.meteo_csv], { type: 'text/csv' });
        const predBlob = new Blob([data.prediction_csv], { type: 'text/csv' });
        const meteoUrl = URL.createObjectURL(meteoBlob);
        const predUrl = URL.createObjectURL(predBlob);
        const meteoA = document.createElement('a');
        const predA = document.createElement('a');
        const today = new Date().toISOString().split('T')[0].replace(/-/g, '');
        meteoA.href = meteoUrl;
        meteoA.download = 'meteo_data_' + today + '.csv';
        predA.href = predUrl;
        predA.download = 'prediction_data_' + today + '.csv';
        document.body.appendChild(meteoA);
        document.body.appendChild(predA);
        meteoA.click();
        predA.click();
        document.body.removeChild(meteoA);
        document.body.removeChild(predA);
        URL.revokeObjectURL(meteoUrl);
        URL.revokeObjectURL(predUrl);
    });

}
</script>
</html>
