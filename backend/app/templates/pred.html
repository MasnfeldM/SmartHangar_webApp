<!DOCTYPE html>
<html lang="cz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meteo_prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='Spaniel_ikona.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Data Predikce</h1>
    <div class="navigation">
        <h2>Rozcestník</h2>
        <button class="nav-link" onclick="window.location.href='{{ url_for('index') }}'">Domů</button>
        <button class="nav-link" onclick="window.location.href='{{ url_for('meteo_page') }}'">Meteo data</button>
        <button class="nav-link" onclick="window.location.href='{{ url_for('prediction_page') }}'">Data predikce</button>
    </div>
    <div class="view-toggle">
        <button class="view-btn active" id="btnTable" onclick="setView('table')" {% if view == 'table' %}disabled{% endif %}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="1" y="1" width="14" height="3" rx="1" fill="currentColor"/>
            <rect x="1" y="6" width="14" height="3" rx="1" fill="currentColor"/>
            <rect x="1" y="11" width="14" height="3" rx="1" fill="currentColor"/>
            </svg>
            Tabulka
        </button>
        <button class="view-btn" id="btnChart" onclick="setView('chart')" {% if view == 'chart' %}disabled{% endif %}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="1,13 5,7 9,10 15,3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            Graf
        </button>
    </div>
    <div class="export-btn">
        <button onclick="downloadFiles()" class="btn">Export CSV</button>
        <span class="export-info">Exportuje všechna data do dvou CSV souborů (meteo a historie predikcí).</span>
    </div>
    <div id="viewTable">
        <div class="pagination-bar">
            <div class="rows-select-wrap">
                <label for="rowsPerPage">Řádků na stránku:</label>
                <select class="rowsPerPage" id="rowsPerPage" name="limit" onchange="goToOffset(0, this)">
                    <option value="5"   {% if limit == 5   %} selected {% endif %}>5</option>
                    <option value="10"  {% if limit == 10  %} selected {% endif %}>10</option>
                    <option value="25"  {% if limit == 25  %} selected {% endif %}>25</option>
                    <option value="50"  {% if limit == 50  %} selected {% endif %}>50</option>
                    <option value="100" {% if limit == 100 %} selected {% endif %}>100</option>
                    <option value="" {% if limit == total_count %} selected {% endif %}>Vše</option>
                </select>
            </div>

            <div class="page-counter">
                <label>Stránka:</label>
                <button data-nav="first" onclick="goToOffset(0)">&#8676;</button>
                <button data-nav="prev"  onclick="goToOffset(currentOffset - currentLimit)">&#8592;</button>
                <span class="page-display" id="pageDisplay"></span>
                <button data-nav="next"  onclick="goToOffset(currentOffset + currentLimit)">&#8594;</button>
                <button data-nav="last"  onclick="goToOffset((totalPages - 1) * currentLimit)">&#8677;</button>
            </div>
        
            <span class="page-info" id="pageInfo"></span>
        </div>

        <table border="1">
            <thead>
                <tr>
                    <th rowspan="2">Datum</th>
                    {% for model in all_model_names %}
                    <th colspan="2">{{ model }}</th>
                    {% endfor %}
                </tr>
                <tr>
                    {% for model in all_model_names %}
                    <th>Sum [&#956;m]</th>
                    <th>Diff [&#956;m]</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody id="predTbody"></tbody>
        </table>
        
        <div class="pagination-bar">
            <div class="rows-select-wrap">
                <label for="rowsPerPage">Řádků na stránku:</label>
                <select class="rowsPerPage" name="limit" onchange="goToOffset(0, this)">
                    <option value="5"   {% if limit == 5   %} selected {% endif %}>5</option>
                    <option value="10"  {% if limit == 10  %} selected {% endif %}>10</option>
                    <option value="25"  {% if limit == 25  %} selected {% endif %}>25</option>
                    <option value="50"  {% if limit == 50  %} selected {% endif %}>50</option>
                    <option value="100" {% if limit == 100 %} selected {% endif %}>100</option>
                    <option value=""   {% if limit == totalCount %} selected {% endif %}>Vše</option>
                </select>
            </div>

            <div class="page-counter">
                <label>Stránka:</label>
                <button data-nav="first" onclick="goToOffset(0)">&#8676;</button>
                <button data-nav="prev"  onclick="goToOffset(currentOffset - currentLimit)">&#8592;</button>
                <span class="page-display" id="pageDisplay"></span>
                <button data-nav="next"  onclick="goToOffset(currentOffset + currentLimit)">&#8594;</button>
                <button data-nav="last"  onclick="goToOffset((totalPages - 1) * currentLimit)">&#8677;</button>
            </div>

            <span class="page-info" id="pageInfo"></span>
        </div>
    </div>
<div id="viewChart" style="display: none;">
    <div class="window-controls">
        <label>Velikost okna:</label>
        <button onclick="windowSize(false)">
            <i class="fa fa-search-plus" aria-hidden="true"></i>
        </button>
        <select class="windowSizeInput" id="windowSizeInput" name="limit" onchange="goToOffset(0, this)">
            <option value="5"   {% if limit == 5   %} selected {% endif %}>5</option>
            <option value="10"  {% if limit == 10  %} selected {% endif %}>10</option>
            <option value="25"  {% if limit == 25  %} selected {% endif %}>25</option>
            <option value="50"  {% if limit == 50  %} selected {% endif %}>50</option>
            <option value="100" {% if limit == 100 %} selected {% endif %}>100</option>
            <option value=""   {% if limit == totalCount %} selected {% endif %}>Vše</option>
        </select>
        <button onclick="windowSize(true)">
            <i class="fa fa-search-minus" aria-hidden="true"></i>
        </button>

        <div class="page-counter">
            <label>Stránka:</label>
            <button data-nav="first" onclick="goToOffset(0)">&#8676;</button>
            <button data-nav="prev"  onclick="goToOffset(currentOffset - currentLimit)">&#8592;</button>
            <span class="page-display" id="pageDisplay"></span>
            <button data-nav="next"  onclick="goToOffset(currentOffset + currentLimit)">&#8594;</button>
            <button data-nav="last"  onclick="goToOffset((totalPages - 1) * currentLimit)">&#8677;</button>
        </div>

        <span class="page-info" id="pageInfo">
    </div>
    <h3>Sumární hodnoty koroze</h3>
    <div class="chart-wrapper">
        <canvas id="sumChart"></canvas>
    </div>
    <h3>Změny koroze</h3>
    <div class="chart-wrapper">
        <canvas id="diffChart"></canvas>
    </div>
    <div class="window-controls">
        <label>Velikost okna:</label>
        <button onclick="windowSize(false)">
            <i class="fa fa-search-plus" aria-hidden="true"></i>
        </button>
        <select class="windowSizeInput" id="windowSizeInput" name="limit" onchange="goToOffset(0, this)">
            <option value="5"   {% if limit == 5   %} selected {% endif %}>5</option>
            <option value="10"  {% if limit == 10  %} selected {% endif %}>10</option>
            <option value="25"  {% if limit == 25  %} selected {% endif %}>25</option>
            <option value="50"  {% if limit == 50  %} selected {% endif %}>50</option>
            <option value="100" {% if limit == 100 %} selected {% endif %}>100</option>
            <option value=""   {% if limit == totalCount %} selected {% endif %}>Vše</option>
        </select>
        <button onclick="windowSize(true)">
            <i class="fa fa-search-minus" aria-hidden="true"></i>
        </button>

        <div class="page-counter">
            <label>Stránka:</label>
            <button data-nav="first" onclick="goToOffset(0)">&#8676;</button>
            <button data-nav="prev"  onclick="goToOffset(currentOffset - currentLimit)">&#8592;</button>
            <span class="page-display" id="pageDisplay"></span>
            <button data-nav="next"  onclick="goToOffset(currentOffset + currentLimit)">&#8594;</button>
            <button data-nav="last"  onclick="goToOffset((totalPages - 1) * currentLimit)">&#8677;</button>
        </div>

        <span class="page-info" id="pageInfo"></span>
    </div>
</div>
    

</body>
<script>
function getModelColor(index) {
    return MODEL_COLORS[index % MODEL_COLORS.length];
}

function renderTable() {
    const tbody = document.getElementById('predTbody');
    if (!tbody) return;
    tbody.innerHTML = '';
    allDatetimes.forEach(dt => {
        let row = `<tr>`;
        row += `<td>${dt}</td>`;
        allModels.forEach(model => {
            const modelData = predData[model] || {};
            const data = modelData[dt] || {};
            const sum  = data.sum;
            const diff = data.diff;
            row += `
                <td>${sum  != null ? fmt(sum)  : '-'}</td>
                <td>${diff != null ? fmt(diff) : '-'}</td>
            `;
        });
        row += `</tr>`;
        tbody.innerHTML += row;
    });
}



let sumChartInst  = null;
let diffChartInst = null;
 
function buildCharts() {
    buildSumChart();
    buildDiffChart();
}

function buildSumChart() {
    if (sumChartInst) sumChartInst.destroy();
 
    const gridColor = 'rgba(0,0,0,0.07)';
    const tickColor = 'rgba(0,0,0,0.45)';
 
    const datasets = allModels.map(model => {
        const color = getModelColor(modelColorIndex[model]);

        return {
            label: model,
            data: allDatetimes.map(dt => {
                const v = predData[model]?.[dt]?.sum;
                return v ?? null;
            }),
            borderColor: color,
            backgroundColor: color + '22',
            borderWidth: 2,
            pointRadius: 3,
            pointHoverRadius: 6,
            tension: 0.3,
            fill: false,
            spanGaps: true,
            hidden: !predActiveSum[model],
        };
    });
    sumChartInst = new Chart(document.getElementById('sumChart'), {
        type: 'line',
        data: { labels: allDatetimes, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: {
                    display: true, position: 'top', align: 'start',
                    labels: { usePointStyle: true },
                    title: { display: true, text: 'Legenda', font: { size: 14 }, position: 'start' },
                    onClick(e, legendItem, legend) {
                        const modelName = legendItem.text;
                        predActiveSum[modelName] = !predActiveSum[modelName];
                        sessionStorage.setItem("predActiveSum", JSON.stringify(predActiveSum));
                        requestAnimationFrame(() => {
                            sumChartInst.destroy();
                            buildSumChart();
                        });
                    }
                },
                tooltip: {
                    enabled: true,
                    callbacks: {
                        label(ctx) {
                            const unit = 'µm';
                            return `${ctx.dataset.label}: ${ctx.formattedValue} ${unit}`;
                        }
                    }
                }
            },
            scales: {
                x: { ticks: { 
                        color: tickColor, 
                        maxTicksLimit: 10, 
                        font: { size: 11 } }, 
                    grid: { color: gridColor } },
                y: { position: 'left', 
                    title: { display: true, 
                        text: 'µm', 
                        color: tickColor }, 
                    ticks: { color: tickColor }, 
                    grid: { color: gridColor },
                    min: 0}
            }
        }
    });
}
 
function buildDiffChart() {
    if (diffChartInst) diffChartInst.destroy();
 
    const gridColor = 'rgba(0,0,0,0.07)';
    const tickColor = 'rgba(0,0,0,0.45)';
 
    const datasets = allModels.map(model => {
        const color = getModelColor(modelColorIndex[model]);

        return {
            label: model,
            data: allDatetimes.map(dt => {
                const v = predData[model]?.[dt]?.diff;
                return v ?? null;
            }),
            borderColor: color,
            backgroundColor: color + '22',
            borderWidth: 2,
            pointRadius: 3,
            pointHoverRadius: 6,
            tension: 0.3,
            fill: false,
            spanGaps: true,
            hidden: !predActiveDiff[model],
        };
    });
 
    diffChartInst = new Chart(document.getElementById('diffChart'), {
        type: 'bar',
        data: { labels: allDatetimes, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: {
                    display: true, position: 'top', align: 'start',
                    labels: { usePointStyle: true },
                    title: { display: true, text: 'Legenda', font: { size: 14 }, position: 'start' },
                    onClick(e, legendItem, legend) {
                        const modelName = legendItem.text;
                        predActiveDiff[modelName] = !predActiveDiff[modelName];
                        sessionStorage.setItem("predActiveDiff", JSON.stringify(predActiveDiff));
                        requestAnimationFrame(() => {
                            diffChartInst.destroy();
                            buildDiffChart();
                        });
                    }
                },
                tooltip: {
                    enabled: true,
                    callbacks: {
                        label(ctx) {
                            const unit = 'µm';
                            return `${ctx.dataset.label}: ${ctx.formattedValue} ${unit}`;
                        }
                    }
                }
            },
            scales: {
                x: { ticks: { 
                        color: tickColor, 
                        maxTicksLimit: 10, 
                        font: { size: 11 } }, 
                        grid: { color: gridColor } },
                y: { position: 'left', 
                    title: { 
                        display: true, 
                        text: 'µm', 
                        color: tickColor }, 
                    ticks: { color: tickColor }, 
                    grid: { color: gridColor } }
            }
        }
    });
}

async function fetchAndRender(offset, limit) {

    sessionStorage.setItem('predOffset', offset);
    sessionStorage.setItem('predLimit', limit);
    const url = `/api/meteo_prediction?offset=${offset}&limit=${limit}`;
    const res  = await fetch(url);
    const json = await res.json();
    

    currentOffset = json.offset;
    currentLimit  = json.limit;
    totalPages    = json.total_pages;
    allDatetimes = json.datetimes;
    predData = json.data;
    totalCount = json.total_count;
    allModels = json.all_model_names;
    sessionStorage.setItem('allModels', JSON.stringify(allModels));

    updatePagination(currentOffset, currentLimit, totalCount);
    renderTable();
    buildCharts();
}

function setView(view) {
    document.getElementById('btnTable').classList.toggle('active', view === 'table');
    document.getElementById('btnChart').classList.toggle('active', view === 'chart');

    document.getElementById('viewTable').style.display = view === 'table' ? '' : 'none';
    document.getElementById('viewChart').style.display = view === 'chart' ? '' : 'none';

    localStorage.setItem('predView', view);

}


async function goToOffset(offset, trigger) {
    const limitVal = trigger?.tagName === 'SELECT'
        ? Number(trigger.value)
        : currentLimit;

    await fetchAndRender(offset, limitVal);
}

async function windowSize(zoom) {
    const steps = [...new Set([5, 10, 25, 50, 100, totalCount])];
    
    let idx = steps.indexOf(currentLimit);
    if (idx === -1) {
        idx = steps.findIndex(s => s > currentLimit);
        if (idx === -1) idx = steps.length - 1;
    }

    const newIdx = zoom
        ? Math.min(idx + 1, steps.length - 1)
        : Math.max(idx - 1, 0);

    await fetchAndRender(currentOffset, steps[newIdx]);
}

function updatePagination(offset, limit, total) {
    const maxTotal = typeof total === "object"
        ? Object.values(total).reduce((a, b) => a + (Number(b) || 0), 0)
        : (Number(total) || 0);

    const pages = Math.ceil(maxTotal / limit) || 1;

    const from = maxTotal === 0 ? 0 : offset + 1;
    const to = Math.min(offset + limit, maxTotal);
    const atStart = offset <= 0;
    const atEnd = offset + limit >= maxTotal;

    document.querySelectorAll('.rowsPerPage, .windowSizeInput').forEach(select => {
        const allOption = select.querySelector('option:last-child');
        if (allOption) {
            allOption.value = maxTotal;
            allOption.textContent = "Vše";
        }
    });

    document.querySelectorAll('.page-display')
        .forEach(el =>
            el.textContent = `${Math.floor(offset / limit) + 1} / ${pages}`
        );

    document.querySelectorAll('.page-info')
        .forEach(el =>
            el.textContent = `${from}–${to} z ${maxTotal} záznamů`
        );

    document.querySelectorAll('[data-nav="first"], [data-nav="prev"]')
        .forEach(btn => btn.disabled = atStart);

    document.querySelectorAll('[data-nav="next"], [data-nav="last"]')
        .forEach(btn => btn.disabled = atEnd);

    document.querySelectorAll('.rowsPerPage')
        .forEach(el => el.value = limit);

    document.querySelectorAll('.windowSizeInput')
        .forEach(el => el.value = limit);
}







// Pomocné funkce
function avg(arr) { return arr.reduce((a,b) => a+b, 0) / arr.length; }
function fmt(x) {
    return Number(x).toExponential(3);
}




// Inicializace
let predData;
let allModels = {{ all_model_names | tojson | safe }};
let currentOffset;
let currentLimit;
let totalPages;
let totalCount;
let allDatetimes;

const MODEL_COLORS = [
    '#D85A30', '#378ADD', '#1D9E75', '#BA7517', '#7F77DD',
    '#E6376A', '#22B5B5', '#8B6914', '#4CAF50', '#FF5722'
];

const modelColorIndex = {};
const predActiveSum = {};
const predActiveDiff = {};
const storedPredActiveSum = JSON.parse(sessionStorage.getItem('predActiveSum')) || {};
const storedPredActiveDiff = JSON.parse(sessionStorage.getItem('predActiveDiff')) || {};
allModels.forEach((m, i) => { 
    modelColorIndex[m] = i; 
    predActiveSum[m] = storedPredActiveSum[m] !== undefined ? storedPredActiveSum[m] : true;
    predActiveDiff[m] = storedPredActiveDiff[m] !== undefined ? storedPredActiveDiff[m] : true;
});

const savedView    = localStorage.getItem('predView') || 'table';
const savedOffset  = Number(sessionStorage.getItem('predOffset')) || 0;
const savedLimit   = Number(sessionStorage.getItem('predLimit'))  || 100;

console.log('Saved view:', savedView, 'Saved offset:', savedOffset, 'Saved limit:', savedLimit, 'limit type', typeof savedLimit);
fetchAndRender(savedOffset, savedLimit);
setView(savedView);


function downloadFiles() {
    const res = fetch('/export_csv').then(r => r.json()).then(data => {
        const meteoBlob = new Blob([data.meteo_csv], { type: 'text/csv' });
        const predBlob = new Blob([data.prediction_csv], { type: 'text/csv' });
        const meteoUrl = URL.createObjectURL(meteoBlob);
        const predUrl = URL.createObjectURL(predBlob);
        const meteoA = document.createElement('a');
        const predA = document.createElement('a');
        const today = new Date().toISOString().split('T')[0].replace(/-/g, '');
        meteoA.href = meteoUrl;
        meteoA.download = 'meteo_data_' + today + '.csv';
        predA.href = predUrl;
        predA.download = 'prediction_data_' + today + '.csv';
        document.body.appendChild(meteoA);
        document.body.appendChild(predA);
        meteoA.click();
        predA.click();
        document.body.removeChild(meteoA);
        document.body.removeChild(predA);
        URL.revokeObjectURL(meteoUrl);
        URL.revokeObjectURL(predUrl);
    });

}
</script>
</html>
